[package]
name = "darkdev"
version = "0.1.0"
edition = "2021"
description = "A development tool for watching and managing multiple projects"
authors = ["Shane Witbeck"]

[[bin]]
name = "dda"
path = "src/bin/dda.rs"

[[bin]]
name = "ddw"
path = "src/bin/ddw.rs"

[[bin]]
name = "ddc"
path = "src/bin/ddc.rs"

[dependencies]
claude-client = { git = "https://github.com/thesurlydev/claude-client", branch = "master" }
notify = "8.0"
notify-debouncer-full = "0.5"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pretty_env_logger = "0.5.0"
log = "0.4"
clap = { version = "4.4", features = ["derive"] }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", features = ["json"] }
